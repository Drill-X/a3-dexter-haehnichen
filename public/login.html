<!doctype html>
<html lang='en'>

<head>
  <title>CS4241 Assignment 2</title>
  <meta charset='utf-8' />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src='js/main.js' defer></script>
  <!--<link rel='stylesheet' href='css/main.css' />-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!-- get rid of favicon error -->
  <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
</head>

<body>
<main class="container-sm mx-auto">
<h1>Sign in</h1>
<div class="row">
<form class="form-group col-5" action="/login/password" method="post">
    <section>
        <label for="username" class="col-form-label">Username</label>
        <input id="username" class="form-control" name="username" type="text" autocomplete="username" required autofocus>
    </section>
    <section>
        <label for="current-password class=col-form-label">Password</label>
        <input id="current-password" class="form-control" name="password" type="password" autocomplete="current-password" required>
    </section>
    <button class="btn btn-primary" type="submit">Sign in</button>
</form>
</div>
<a href="/auth/github">Login with GitHub</a>
</main>
</body>
</html>
